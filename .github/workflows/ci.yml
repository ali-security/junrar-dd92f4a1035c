name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task + filter (e.g. "test --tests com.github.junrar.JunrarTest"); empty runs the full build'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Enable test result logging
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/seal-test-logging.gradle <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events 'passed', 'skipped', 'failed'
                      exceptionFormat 'full'
                  }
                  afterSuite { desc, result ->
                      if (!desc.parent) {
                          println "TEST SUMMARY (${path}): ${result.resultType} - ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
                      }
                  }
              }
          }
          EOF
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('jar assemble {0}', inputs.test-filter) || 'jar build -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest' }}
      - name: Report skipped tests
        if: always()
        run: |
          grep -h -B1 '<skipped' build/test-results/*/*.xml || echo "No skipped tests"
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: matrix.java == '8'
        with:
          name: junrar-jar
          path: build/libs/junrar-7.5.3.jar
          if-no-files-found: error

  release:
    name: semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
